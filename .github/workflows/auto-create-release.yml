name: Auto Create Release

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build shortcut backup zips
        run: |
          python3 .scripts/build_release_zips.py

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            All_Shortcuts_with_Folders.zip
            All_Shortcuts_without_Folders.zip
          draft: false
          prerelease: false
          discussion_category_name: Show and tell
          generate_release_notes: true
          make_latest: true
          token: ${{ secrets.SHORTCUTOMATION }}
